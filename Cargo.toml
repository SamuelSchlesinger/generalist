[package]
name = "generalist"
version = "0.2.0"
edition = "2021"
authors = ["Samuel Schlesinger <sgschlesinger@gmail.com>"]
description = "A provider-agnostic CLI agent with tool use. Works with Anthropic and any OpenAI-compatible API."
homepage = "https://github.com/SamuelSchlesinger/generalist"
repository = "https://github.com/SamuelSchlesinger/generalist"
license = "MIT"
readme = "README.md"
keywords = ["agent", "llm", "ai", "chatbot", "tools"]
categories = ["command-line-utilities"]

[dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dialoguer = "0.12"
colored = "3.1"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
unicode-width = "0.2"
dotenv = "0.15.0"
exmex = "0.21"
urlencoding = "2.1"
uuid = { version = "1.24.0", features = ["v4", "v5"] }
tempfile = "3.27"
firecrawl = "2.12.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }

[[bin]]
name = "generalist"
path = "src/main.rs"
