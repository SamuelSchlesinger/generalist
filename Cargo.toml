[package]
name = "generalist"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
authors = ["Samuel Schlesinger <sgschlesinger@gmail.com>"]
description = "A provider-agnostic CLI agent with tool use for Anthropic, Cerebras, and OpenAI-compatible APIs."
homepage = "https://github.com/SamuelSchlesinger/generalist"
repository = "https://github.com/SamuelSchlesinger/generalist"
license = "MIT"
readme = "README.md"
keywords = ["agent", "llm", "ai", "chatbot", "tools"]
categories = ["command-line-utilities"]

[features]
default = []
# Builds the in-process inference provider and validated model-pack boundary.
# Native MLX linkage remains an explicit machine-specific build step.
embedded-mlx = ["dep:ring", "dep:tokenizers"]
# Links the machine-built static MLX/MLX-C archives into Generalist. Enabling
# this requires the pinned source/build paths documented in native/mlx.
embedded-mlx-native = ["embedded-mlx"]

[dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dialoguer = { version = "0.12", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
unicode-width = "0.2"
dotenvy = "0.15.7"
exmex = "0.21"
libc = "0.2"
uuid = { version = "1.24.0", features = ["v4", "v5"] }
tempfile = "3.27"
firecrawl = "2.12.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
ring = { version = "0.17.14", optional = true }
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"], optional = true }

[[bin]]
name = "generalist"
path = "src/main.rs"

[[example]]
name = "embedded_model_probe"
path = "examples/embedded_model_probe.rs"
required-features = ["embedded-mlx"]

[[example]]
name = "embedded_native_probe"
path = "examples/embedded_native_probe.rs"
required-features = ["embedded-mlx-native"]

[[example]]
name = "embedded_decode_benchmark"
path = "examples/embedded_decode_benchmark.rs"
required-features = ["embedded-mlx-native"]

[[example]]
name = "embedded_decode_trace"
path = "examples/embedded_decode_trace.rs"
required-features = ["embedded-mlx-native"]

[[example]]
name = "embedded_decode_ab"
path = "examples/embedded_decode_ab.rs"
required-features = ["embedded-mlx-native"]

[[example]]
name = "embedded_mtp_checkpoint"
path = "examples/embedded_mtp_checkpoint.rs"
required-features = ["embedded-mlx-native"]

[[example]]
name = "embedded_speculative_benchmark"
path = "examples/embedded_speculative_benchmark.rs"
required-features = ["embedded-mlx-native"]

[[example]]
name = "embedded_speculative_trace"
path = "examples/embedded_speculative_trace.rs"
required-features = ["embedded-mlx-native"]

[[example]]
name = "embedded_prefix_cache_benchmark"
path = "examples/embedded_prefix_cache_benchmark.rs"
required-features = ["embedded-mlx-native"]

[[example]]
name = "embedded_provider_benchmark"
path = "examples/embedded_provider_benchmark.rs"
required-features = ["embedded-mlx-native"]

[[example]]
name = "embedded_ollama_benchmark"
path = "examples/embedded_ollama_benchmark.rs"
required-features = ["embedded-mlx-native"]

[[example]]
name = "smoke_embedded"
path = "examples/smoke_embedded.rs"
required-features = ["embedded-mlx-native"]
